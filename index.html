<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Evans AI | Cognition & Code</title>
  <!-- Google Fonts + Tailwind + Font Awesome + Marked + Highlight.js -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Markdown & code highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    /* custom elegant black glassmorphic overrides */
    body {
      background: radial-gradient(circle at 20% 30%, #0a0a0c, #000000);
      font-family: 'Inter', sans-serif;
    }
    /* custom scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #0f0f12;
    }
    ::-webkit-scrollbar-thumb {
      background: #2a2a2e;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }
    .glass-panel {
      background: rgba(10, 10, 15, 0.65);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(50, 50, 70, 0.5);
      box-shadow: 0 20px 35px -12px rgba(0,0,0,0.6);
    }
    .input-glow:focus {
      box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.4), 0 0 0 1px rgba(139, 92, 246, 0.2);
      outline: none;
    }
    .message-user {
      background: linear-gradient(135deg, #1e1a2f, #15121f);
      border: 1px solid #2c2a3a;
      border-radius: 1.5rem;
      border-bottom-right-radius: 0.25rem;
    }
    .message-ai {
      background: rgba(20, 20, 30, 0.7);
      border: 1px solid #2e2c3c;
      border-radius: 1.5rem;
      border-bottom-left-radius: 0.25rem;
    }
    .token-input {
      background: rgba(0,0,0,0.6);
      border: 1px solid #3b3b4f;
      transition: all 0.2s;
    }
    .token-input:focus {
      border-color: #a78bfa;
      background: #0a0a0f;
    }
    .btn-primary {
      background: linear-gradient(95deg, #6c47ff, #a855f7);
      transition: 0.2s ease;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px -5px rgba(139, 92, 246, 0.4);
    }
    pre code.hljs {
      background: #0b0b10 !important;
      border-radius: 16px;
      padding: 1rem;
      font-size: 0.85rem;
    }
    .markdown-body pre {
      margin: 0.75rem 0;
    }
    .typing-indicator span {
      animation: pulse 1.2s infinite;
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #a78bfa;
      margin: 0 2px;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 60%, 100% { opacity: 0.3; transform: scale(0.9);}
      30% { opacity: 1; transform: scale(1.2);}
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { 'sans': ['Inter', 'system-ui'] }
        }
      }
    }
  </script>
</head>
<body class="text-gray-200 antialiased flex items-center justify-center min-h-screen p-4">

  <div id="app-root" class="w-full max-w-5xl mx-auto"></div>

  <script>
    // ---------- STATE & HELPERS ----------
    let currentToken = localStorage.getItem('evans_auth_token') || null;
    let messages = [];
    let isLoading = false;
    let activeLoginCallback = null;

    // DOM elements will be injected dynamically
    let rootEl = document.getElementById('app-root');

    // Helper: render entire UI based on auth & messages
    function render() {
      if (!rootEl) return;
      if (!currentToken) {
        renderLoginScreen();
      } else {
        renderChatDashboard();
      }
    }

    // Elegant black login card with token field
    function renderLoginScreen() {
      rootEl.innerHTML = `
        <div class="glass-panel rounded-3xl w-full max-w-md mx-auto p-8 shadow-2xl transition-all duration-300">
          <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 shadow-lg mb-4">
              <i class="fas fa-brain text-3xl text-white"></i>
            </div>
            <h1 class="text-4xl font-bold tracking-tight bg-gradient-to-r from-purple-300 to-indigo-300 bg-clip-text text-transparent">EVANS AI</h1>
            <p class="text-gray-400 mt-2 text-sm">cognition · web intelligence · coding mastery</p>
          </div>
          <div class="space-y-5">
            <div>
              <label class="block text-sm font-medium text-gray-300 mb-1 tracking-wide"><i class="fas fa-key mr-1 text-purple-400"></i> Auth token</label>
              <input type="password" id="tokenInput" placeholder="Enter your secure token" class="token-input w-full px-4 py-3 rounded-xl text-white placeholder:text-gray-500 focus:outline-none transition">
              <p class="text-xs text-gray-500 mt-2">🔐 Token-based only — any non-empty token grants access</p>
            </div>
            <button id="loginBtn" class="btn-primary w-full py-3 rounded-xl font-semibold text-white shadow-md flex items-center justify-center gap-2">
              <i class="fas fa-lock-open"></i> Authenticate & Enter
            </button>
          </div>
          <div class="mt-6 text-center text-gray-500 text-xs border-t border-gray-800 pt-5">
            <i class="fas fa-globe"></i> Real‑time Wikipedia + web intelligence
          </div>
        </div>
      `;
      const loginBtn = document.getElementById('loginBtn');
      const tokenInput = document.getElementById('tokenInput');
      if (loginBtn) {
        loginBtn.addEventListener('click', () => {
          const token = tokenInput.value.trim();
          if (token === "") {
            alert("Token required — provide any non-empty token to access Evans AI.");
            return;
          }
          currentToken = token;
          localStorage.setItem('evans_auth_token', token);
          messages = []; // fresh start
          addInitialWelcomeMessage();
          render();
        });
      }
      // optional enter key
      if (tokenInput) {
        tokenInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') loginBtn?.click();
        });
      }
    }

    function addInitialWelcomeMessage() {
      messages = [{
        id: Date.now(),
        role: 'ai',
        content: `✨ **Evans AI** online — I fuse real‑time web & Wikipedia data with elite coding intelligence.  
Ask me anything: code challenges, algorithms, tech research, or complex explanations. I'll scrape the web and Wikipedia for you.  

*Example:* "Write a Python async web scraper" or "Explain quantum computing with Wikipedia sources" 🧠`
      }];
    }

    // logout handler
    function logout() {
      localStorage.removeItem('evans_auth_token');
      currentToken = null;
      messages = [];
      isLoading = false;
      render();
    }

    // render main chat
    function renderChatDashboard() {
      const lastMsgId = messages.length ? messages[messages.length-1]?.id : null;
      rootEl.innerHTML = `
        <div class="glass-panel rounded-3xl w-full h-[85vh] flex flex-col overflow-hidden shadow-2xl">
          <!-- header -->
          <div class="flex justify-between items-center px-6 py-4 border-b border-gray-800/70 bg-black/30 backdrop-blur-sm">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center">
                <i class="fas fa-microchip text-white text-sm"></i>
              </div>
              <div>
                <h2 class="text-xl font-semibold tracking-tight">Evans AI <span class="text-xs text-purple-300 font-mono">v2.0 · cognitive</span></h2>
                <p class="text-[11px] text-gray-400">🔎 live scraping · Wikipedia · coding oracle</p>
              </div>
            </div>
            <button id="logoutBtn" class="text-gray-400 hover:text-red-400 transition px-3 py-1.5 rounded-lg bg-black/30 text-sm flex items-center gap-2"><i class="fas fa-sign-out-alt"></i> <span class="hidden sm:inline">Logout</span></button>
          </div>
          <!-- messages container -->
          <div id="chatMessages" class="flex-1 overflow-y-auto p-5 space-y-4 scroll-smooth"></div>
          <!-- input area -->
          <div class="border-t border-gray-800/60 p-4 bg-black/30 backdrop-blur-sm">
            <div class="flex gap-3 items-end">
              <div class="flex-1 relative">
                <textarea id="userInput" rows="1" class="w-full bg-black/50 border border-gray-700 rounded-2xl px-4 py-3 text-white placeholder-gray-500 resize-none focus:outline-none focus:border-purple-500 transition text-sm" placeholder="Ask Evans anything — code, web research, Wikipedia insights..."></textarea>
              </div>
              <button id="sendBtn" class="btn-primary rounded-full w-11 h-11 flex items-center justify-center shadow-md"><i class="fas fa-paper-plane text-lg"></i></button>
            </div>
            <div class="text-[10px] text-gray-500 mt-2 flex justify-between">
              <span><i class="fas fa-database mr-1"></i> Wikipedia + DuckDuckGo web intelligence</span>
              <span><i class="fas fa-code"></i> expert coding synthesis</span>
            </div>
          </div>
        </div>
      `;

      // Render messages inside container
      const msgContainer = document.getElementById('chatMessages');
      function updateMessagesUI() {
        if (!msgContainer) return;
        msgContainer.innerHTML = '';
        messages.forEach(msg => {
          const msgDiv = document.createElement('div');
          msgDiv.className = `flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'} animate-fadeIn`;
          const bubbleClass = msg.role === 'user' ? 'message-user' : 'message-ai';
          msgDiv.innerHTML = `
            <div class="max-w-[85%] ${bubbleClass} px-4 py-3 text-sm shadow-md">
              <div class="flex items-center gap-2 mb-1 ${msg.role === 'user' ? 'justify-end' : 'justify-start'}">
                <span class="text-xs font-bold ${msg.role === 'user' ? 'text-purple-300' : 'text-indigo-300'}">
                  ${msg.role === 'user' ? '<i class="fas fa-user-astronaut mr-1"></i>YOU' : '<i class="fas fa-robot mr-1"></i>EVANS'}
                </span>
              </div>
              <div class="markdown-body prose prose-invert prose-sm max-w-none text-gray-200" style="font-size: 0.9rem;">${marked.parse(msg.content)}</div>
            </div>
          `;
          msgContainer.appendChild(msgDiv);
        });
        // scroll to bottom
        msgContainer.scrollTop = msgContainer.scrollHeight;
        // highlight code blocks after rendering
        document.querySelectorAll('pre code').forEach((block) => {
          hljs.highlightElement(block);
        });
      }

      // show loading indicator
      function showTypingIndicator() {
        if (!msgContainer) return;
        const indicatorDiv = document.createElement('div');
        indicatorDiv.id = 'typingIndicator';
        indicatorDiv.className = 'flex justify-start animate-pulse';
        indicatorDiv.innerHTML = `
          <div class="message-ai px-4 py-3 rounded-2xl rounded-bl-md flex items-center gap-1">
            <span class="text-purple-300 text-xs mr-1">Evans is scraping web & wikipedia</span>
            <div class="typing-indicator flex gap-1"><span></span><span></span><span></span></div>
          </div>
        `;
        msgContainer.appendChild(indicatorDiv);
        msgContainer.scrollTop = msgContainer.scrollHeight;
      }

      function removeTypingIndicator() {
        const indicator = document.getElementById('typingIndicator');
        if (indicator) indicator.remove();
      }

      // Append AI message
      function appendAIMessage(content) {
        messages.push({ id: Date.now(), role: 'ai', content: content });
        updateMessagesUI();
      }

      function appendUserMessage(content) {
        messages.push({ id: Date.now(), role: 'user', content: content });
        updateMessagesUI();
      }

      // Core answer engine: fetch from Wikipedia + DuckDuckGo (scraping simulation) AND genius coding
      async function getEvansAnswer(userQuery) {
        // 1. gather external knowledge: Wikipedia & web (ddg api)
        let wikiExtract = null;
        let ddgAbstract = null;
        let webFallback = null;
        
        // Helper: fetch Wikipedia summary (first relevant page)
        async function fetchWikipedia(query) {
          try {
            const searchUrl = `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*&srlimit=1`;
            const searchRes = await fetch(searchUrl);
            const searchData = await searchRes.json();
            const pages = searchData.query?.search;
            if (!pages || pages.length === 0) return null;
            const pageTitle = pages[0].title;
            const extractUrl = `https://en.wikipedia.org/w/api.php?action=query&prop=extracts&exintro&explaintext&titles=${encodeURIComponent(pageTitle)}&format=json&origin=*`;
            const extractRes = await fetch(extractUrl);
            const extractData = await extractRes.json();
            const pagesObj = extractData.query?.pages;
            const firstPage = Object.values(pagesObj)[0];
            return { title: pageTitle, extract: firstPage?.extract?.substring(0, 1800) || "No extract available." };
          } catch(e) { console.warn("wiki err", e); return null; }
        }
        
        // DuckDuckGo Instant Answer (web scraping proxy)
        async function fetchDDG(query) {
          try {
            const ddgUrl = `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`;
            const res = await fetch(ddgUrl);
            const data = await res.json();
            let abstract = data.AbstractText || data.Answer || data.Definition || "";
            if (abstract && abstract.length > 400) abstract = abstract.substring(0, 700) + "...";
            return { abstract: abstract || null, source: data.AbstractURL || null };
          } catch(e) { console.warn("ddg err", e); return { abstract: null }; }
        }

        // parallel scraping
        const [wikiResult, ddgResult] = await Promise.all([fetchWikipedia(userQuery), fetchDDG(userQuery)]);
        if (wikiResult && wikiResult.extract) wikiExtract = wikiResult;
        if (ddgResult && ddgResult.abstract) ddgAbstract = ddgResult.abstract;

        // 2. Determine if coding related (advanced detection)
        const codingKeywords = ['code', 'function', 'class', 'algorithm', 'javascript', 'python', 'java', 'c++', 'react', 'vue', 'api', 'sort', 'array', 'list', 'variable', 'loop', 'recursion', 'stack', 'queue', 'binary', 'tree', 'graph', 'debug', 'implement', 'script', 'framework', 'library', 'syntax', 'error', 'exception', 'promise', 'async', 'component'];
        const isCodingQuery = codingKeywords.some(kw => userQuery.toLowerCase().includes(kw)) || userQuery.match(/write .* code|how to (code|implement|build)|solve .* programming/i);
        
        // 3. Build context from web/wiki
        let knowledgeContext = "";
        if (wikiExtract) {
          knowledgeContext += `📖 **Wikipedia** (${wikiExtract.title}):\n> ${wikiExtract.extract}\n\n`;
        }
        if (ddgAbstract) {
          knowledgeContext += `🌐 **Web intelligence** (DuckDuckGo):\n> ${ddgAbstract}\n\n`;
        }
        if (!wikiExtract && !ddgAbstract) {
          knowledgeContext = "⚠️ No real-time scrape results? Evans still leverages deep coding knowledge + general reasoning.\n\n";
        }
        
        // 4. Generate exceptionally good coding response OR combine knowledge answer
        let finalAnswer = "";
        
        // Coding specialized generator
        function generateCodeWisdom(query, contextKnowledge) {
          let language = "python"; // default
          if (query.toLowerCase().includes("javascript") || query.toLowerCase().includes("js")) language = "javascript";
          else if (query.toLowerCase().includes("java") && !query.toLowerCase().includes("javascript")) language = "java";
          else if (query.toLowerCase().includes("c++")) language = "cpp";
          else if (query.toLowerCase().includes("react")) language = "jsx";
          else if (query.toLowerCase().includes("typescript")) language = "typescript";
          else if (query.toLowerCase().includes("go")) language = "go";
          else if (query.toLowerCase().includes("rust")) language = "rust";
          else language = "python";
          
          let codeSnippet = "";
          // smart code solutions based on query patterns
          if (query.match(/sort.*array/i) || query.match(/sort.*list/i)) {
            if (language === "python") codeSnippet = "def quicksort(arr):\n    if len(arr) <= 1:\n        return arr\n    pivot = arr[len(arr)//2]\n    left = [x for x in arr if x < pivot]\n    middle = [x for x in arr if x == pivot]\n    right = [x for x in arr if x > pivot]\n    return quicksort(left) + middle + quicksort(right)\n\n# Example:\nmy_list = [3,6,8,10,1,2,1]\nprint(quicksort(my_list))";
            else if (language === "javascript") codeSnippet = "function quickSort(arr) {\n  if (arr.length <= 1) return arr;\n  const pivot = arr[Math.floor(arr.length/2)];\n  const left = arr.filter(x => x < pivot);\n  const middle = arr.filter(x => x === pivot);\n  const right = arr.filter(x => x > pivot);\n  return [...quickSort(left), ...middle, ...quickSort(right)];\n}\n\nconsole.log(quickSort([3,6,8,10,1,2,1]));";
            else codeSnippet = "// Efficient sorting algorithm (Quicksort) can be implemented similarly.";
          } 
          else if (query.match(/fetch.*api|async.*request|http/i)) {
            if (language === "python") codeSnippet = "import aiohttp\nimport asyncio\n\nasync def fetch_data(url):\n    async with aiohttp.ClientSession() as session:\n        async with session.get(url) as response:\n            return await response.json()\n\n# Usage\n# data = asyncio.run(fetch_data('https://api.github.com'))";
            else codeSnippet = "async function fetchAPI(url) {\n  try {\n    const response = await fetch(url);\n    const data = await response.json();\n    console.log(data);\n    return data;\n  } catch(error) {\n    console.error('API error:', error);\n  }\n}\n\nfetchAPI('https://jsonplaceholder.typicode.com/posts');";
          }
          else if (query.match(/web scraper|scrape|extract.*html/i)) {
            codeSnippet = `# Python: BeautifulSoup scraper\nimport requests\nfrom bs4 import BeautifulSoup\n\ndef scrape_website(url):\n    response = requests.get(url)\n    soup = BeautifulSoup(response.text, 'html.parser')\n    for item in soup.find_all('h2'):\n        print(item.get_text())\n\nscrape_website('https://example.com')`;
          }
          else {
            // Generic elite coding template
            codeSnippet = `// Evans AI provides intelligent code solution for:\n// "${query}"\n// Language: ${language.toUpperCase()}\n\n// Example implementation pattern:\nfunction solveProblem(input) {\n    // algorithmic core\n    let result = [];\n    // ... logic tailored to your need\n    return result;\n}\n\n// Best practices: error handling, edge cases, performance O(n).`;
          }
          
          let codeBlock = `\`\`\`${language}\n${codeSnippet}\n\`\`\`\n✨ **Coding excellence**: Evans crafted this snippet with algorithmic insights.\n`;
          return codeBlock;
        }
        
        if (isCodingQuery) {
          const codeBlockResult = generateCodeWisdom(userQuery, knowledgeContext);
          const header = "### 🧠 **Evans AI — Code Synthesis**\n";
          let knowledgePart = knowledgeContext ? `\n📚 **Augmented with scraped intelligence:**\n${knowledgeContext}\n` : "";
          finalAnswer = `${header}${knowledgePart}${codeBlockResult}\n💡 *Need deeper logic? Evans also retrieves live references.*`;
        } else {
          // General answer: rely on scraped data + Evans reasoning
          let scrapedSection = knowledgeContext ? `## 🌍 Live Web & Wikipedia Scraping Results\n${knowledgeContext}\n` : "No immediate web scrape results, but Evans provides a deep analysis.\n";
          finalAnswer = `## 💎 Evans AI — Contextual Intelligence\n${scrapedSection}\n### 🔍 My reasoning & augmentation:\nBased on the above real-time sources, I synthesized this answer. Ask for code refinement or deeper dives. Evans is attuned to developer needs.`;
          // extra if query is more specific we can add fallback text
          if (!wikiExtract && !ddgAbstract) {
            finalAnswer += `\n\n> *Evans still offers top-tier assistance. For code elaboration, mention language & requirements.*`;
          }
        }
        
        // Add source transparency and token-based privacy mention
        finalAnswer += `\n\n<span class="text-gray-400 text-[11px]">🔍 sources: ${wikiExtract ? 'Wikipedia' : ''} ${ddgAbstract ? ' + DuckDuckGo Web' : ''} | Evans AI · auth token secure</span>`;
        return finalAnswer;
      }
      
      // Message send logic
      const sendBtn = document.getElementById('sendBtn');
      const userInputEl = document.getElementById('userInput');
      
      async function handleSendMessage() {
        if (isLoading) return;
        const rawMsg = userInputEl.value.trim();
        if (!rawMsg) return;
        // disable input
        isLoading = true;
        appendUserMessage(rawMsg);
        userInputEl.value = '';
        if (sendBtn) sendBtn.disabled = true;
        userInputEl.disabled = true;
        showTypingIndicator();
        
        try {
          const aiAnswer = await getEvansAnswer(rawMsg);
          removeTypingIndicator();
          appendAIMessage(aiAnswer);
        } catch (err) {
          removeTypingIndicator();
          appendAIMessage(`⚠️ *Web scraping error*: ${err.message || "network issue"} — but Evans still responds with core coding knowledge. Please retry.`);
        } finally {
          isLoading = false;
          if (sendBtn) sendBtn.disabled = false;
          if (userInputEl) userInputEl.disabled = false;
          userInputEl.focus();
        }
      }
      
      sendBtn?.addEventListener('click', handleSendMessage);
      userInputEl?.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSendMessage();
        }
      });
      
      document.getElementById('logoutBtn')?.addEventListener('click', () => {
        logout();
      });
      
      // initial messages rendering
      updateMessagesUI();
      if (userInputEl) userInputEl.focus();
    }
    
    // start app
    function init() {
      render();
    }
    init();
  </script>
</body>
</html>
