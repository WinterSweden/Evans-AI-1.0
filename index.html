<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Evans AI | People & Code Intelligence</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    body {
      background: radial-gradient(circle at 20% 30%, #0a0a0c, #000000);
      font-family: 'Inter', sans-serif;
    }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #0f0f12; }
    ::-webkit-scrollbar-thumb { background: #2a2a2e; border-radius: 4px; }
    .glass-panel {
      background: rgba(10, 10, 15, 0.65);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(50, 50, 70, 0.5);
      box-shadow: 0 20px 35px -12px rgba(0,0,0,0.6);
    }
    .message-user {
      background: linear-gradient(135deg, #1e1a2f, #15121f);
      border: 1px solid #2c2a3a;
      border-radius: 1.5rem;
      border-bottom-right-radius: 0.25rem;
    }
    .message-ai {
      background: rgba(20, 20, 30, 0.7);
      border: 1px solid #2e2c3c;
      border-radius: 1.5rem;
      border-bottom-left-radius: 0.25rem;
    }
    .token-input {
      background: rgba(0,0,0,0.6);
      border: 1px solid #3b3b4f;
      transition: all 0.2s;
    }
    .token-input:focus {
      border-color: #a78bfa;
      background: #0a0a0f;
    }
    .btn-primary {
      background: linear-gradient(95deg, #6c47ff, #a855f7);
      transition: 0.2s ease;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px -5px rgba(139, 92, 246, 0.4);
    }
    pre code.hljs {
      background: #0b0b10 !important;
      border-radius: 16px;
      padding: 1rem;
      font-size: 0.85rem;
    }
    .typing-indicator span {
      animation: pulse 1.2s infinite;
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #a78bfa;
      margin: 0 2px;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 60%, 100% { opacity: 0.3; transform: scale(0.9);}
      30% { opacity: 1; transform: scale(1.2);}
    }
    .source-badge {
      display: inline-block;
      font-size: 0.7rem;
      background: rgba(0,0,0,0.5);
      border-radius: 20px;
      padding: 0.2rem 0.6rem;
      margin-right: 0.5rem;
      margin-top: 0.5rem;
    }
  </style>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { 'sans': ['Inter', 'system-ui'] } } } }
  </script>
</head>
<body class="text-gray-200 antialiased flex items-center justify-center min-h-screen p-4">
  <div id="app-root" class="w-full max-w-5xl mx-auto"></div>

  <script>
    let currentToken = localStorage.getItem('evans_auth_token') || null;
    let messages = [];
    let isLoading = false;
    let rootEl = document.getElementById('app-root');

    function render() {
      if (!rootEl) return;
      if (!currentToken) renderLoginScreen();
      else renderChatDashboard();
    }

    function renderLoginScreen() {
      rootEl.innerHTML = `
        <div class="glass-panel rounded-3xl w-full max-w-md mx-auto p-8 shadow-2xl">
          <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 shadow-lg mb-4">
              <i class="fas fa-brain text-3xl text-white"></i>
            </div>
            <h1 class="text-4xl font-bold bg-gradient-to-r from-purple-300 to-indigo-300 bg-clip-text text-transparent">EVANS AI</h1>
            <p class="text-gray-400 mt-2 text-sm">people search · code · live synthesis</p>
          </div>
          <div class="space-y-5">
            <div>
              <label class="block text-sm font-medium text-gray-300 mb-1"><i class="fas fa-key mr-1 text-purple-400"></i> Auth token</label>
              <input type="password" id="tokenInput" placeholder="Enter your secure token" class="token-input w-full px-4 py-3 rounded-xl text-white placeholder:text-gray-500 focus:outline-none">
              <p class="text-xs text-gray-500 mt-2">🔐 Token-based only — any non‑empty token works</p>
            </div>
            <button id="loginBtn" class="btn-primary w-full py-3 rounded-xl font-semibold text-white flex items-center justify-center gap-2"><i class="fas fa-lock-open"></i> Authenticate</button>
          </div>
          <div class="mt-6 text-center text-gray-500 text-xs border-t border-gray-800 pt-5"><i class="fab fa-linkedin"></i> LinkedIn · <i class="fab fa-google"></i> Google · <i class="fab fa-wikipedia-w"></i> Wikipedia</div>
        </div>
      `;
      document.getElementById('loginBtn')?.addEventListener('click', () => {
        const token = document.getElementById('tokenInput').value.trim();
        if (!token) { alert("Token required."); return; }
        currentToken = token;
        localStorage.setItem('evans_auth_token', token);
        messages = [];
        messages.push({ id: Date.now(), role: 'ai', content: `✨ **Evans AI** — I search **LinkedIn**, **Google**, **Wikipedia**, **Stack Overflow** & **GitHub** to give you factual answers, people profiles, and working code. Ask about anyone or anything.` });
        render();
      });
      document.getElementById('tokenInput')?.addEventListener('keypress', e => { if (e.key === 'Enter') document.getElementById('loginBtn').click(); });
    }

    function logout() { localStorage.removeItem('evans_auth_token'); currentToken = null; messages = []; isLoading = false; render(); }

    // ---------- API FETCHERS ----------
    async function fetchWikipedia(query) {
      try {
        const searchUrl = `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*&srlimit=1`;
        const searchRes = await fetch(searchUrl);
        const searchData = await searchRes.json();
        const pages = searchData.query?.search;
        if (!pages?.length) return null;
        const pageTitle = pages[0].title;
        const extractUrl = `https://en.wikipedia.org/w/api.php?action=query&prop=extracts&exintro&explaintext&titles=${encodeURIComponent(pageTitle)}&format=json&origin=*`;
        const extractRes = await fetch(extractUrl);
        const extractData = await extractRes.json();
        const pagesObj = extractData.query?.pages;
        const firstPage = Object.values(pagesObj)[0];
        return { title: pageTitle, extract: firstPage?.extract?.substring(0, 1000) || null };
      } catch(e) { return null; }
    }

    async function fetchStackOverflow(query) {
      try {
        const url = `https://api.stackexchange.com/2.3/search/advanced?order=desc&sort=relevance&q=${encodeURIComponent(query)}&site=stackoverflow&filter=!-*jbN.o5Sc5E&pagesize=1`;
        const res = await fetch(url);
        const data = await res.json();
        if (!data.items?.length) return null;
        const item = data.items[0];
        const questionUrl = `https://api.stackexchange.com/2.3/questions/${item.question_id}?order=desc&sort=activity&site=stackoverflow&filter=withbody`;
        const qRes = await fetch(questionUrl);
        const qData = await qRes.json();
        let body = qData.items?.[0]?.body_markdown || item.title;
        body = body.replace(/<[^>]*>/g, '').substring(0, 600);
        return { title: item.title, link: item.link, excerpt: body, score: item.score };
      } catch(e) { return null; }
    }

    async function fetchGitHub(query) {
      try {
        const url = `https://api.github.com/search/code?q=${encodeURIComponent(query)}+language:python+OR+language:javascript+OR+language:java&per_page=1`;
        const res = await fetch(url, { headers: { 'Accept': 'application/vnd.github.v3+json' } });
        const data = await res.json();
        if (!data.items?.length) {
          const repoUrl = `https://api.github.com/search/repositories?q=${encodeURIComponent(query)}&sort=stars&per_page=1`;
          const repoRes = await fetch(repoUrl);
          const repoData = await repoRes.json();
          if (repoData.items?.length) {
            const repo = repoData.items[0];
            return { type: 'repo', name: repo.full_name, description: repo.description, url: repo.html_url, stars: repo.stargazers_count };
          }
          return null;
        }
        const codeItem = data.items[0];
        return { type: 'code', repo: codeItem.repository.full_name, path: codeItem.path, url: codeItem.html_url };
      } catch(e) { return null; }
    }

    // ---------- PEOPLE DETECTION + LINKEDIN/GOOGLE SEARCH ----------
    function isPersonQuery(query) {
      const lower = query.toLowerCase();
      // explicit person indicators
      if (lower.match(/who is|about me|tell me about|biography of|profile of|background of/i)) return true;
      // if query is short and not code-heavy (simple heuristic)
      const codeKeywords = ['function', 'code', 'api', 'react', 'python', 'javascript', 'html', 'css', 'sort', 'algorithm'];
      const hasCodeKeyword = codeKeywords.some(kw => lower.includes(kw));
      if (!hasCodeKeyword && query.split(' ').length <= 5 && query.length > 3) return true;
      return false;
    }

    function getPersonSearchLinks(name) {
      const encoded = encodeURIComponent(name);
      const googleSearch = `https://www.google.com/search?q=${encoded}`;
      const linkedinSearch = `https://www.linkedin.com/search/results/people/?keywords=${encodeURIComponent(name)}`;
      return { googleSearch, linkedinSearch };
    }

    // ---------- MAIN ANSWER ENGINE (no heading, includes people search) ----------
    async function generateAnswer(query) {
      const lowerQuery = query.toLowerCase();
      const isPerson = isPersonQuery(query);
      let answer = "";

      // --- Person mode: prioritize Wikipedia + LinkedIn/Google links ---
      if (isPerson) {
        const wiki = await fetchWikipedia(query);
        const { googleSearch, linkedinSearch } = getPersonSearchLinks(query);
        
        if (wiki && wiki.extract) {
          answer += `**📖 Wikipedia – ${wiki.title}**\n> ${wiki.extract.substring(0, 700)}${wiki.extract.length > 700 ? '…' : ''}\n\n`;
        } else {
          answer += `🔍 No Wikipedia article found for "${query}", but here are live search results:\n\n`;
        }
        
        answer += `### 🔎 Real‑time People Search\n\n`;
        answer += `- <i class="fab fa-google"></i> **Google Search**: [${query} on Google](${googleSearch})\n`;
        answer += `- <i class="fab fa-linkedin"></i> **LinkedIn Profiles**: [Find "${query}" on LinkedIn](${linkedinSearch})\n\n`;
        answer += `> *Evans suggests using these links to get the most recent professional information.*\n\n`;
        
        // also add generic knowledge if any
        answer += `---\n*If you need code or technical help, ask me that too.*`;
        return answer;
      }
      
      // --- Technical / general mode: use Wikipedia, Stack Overflow, GitHub ---
      const [wiki, so, github] = await Promise.all([
        fetchWikipedia(query),
        fetchStackOverflow(query),
        fetchGitHub(query)
      ]);

      if (wiki && wiki.extract) {
        answer += `**📖 Wikipedia Insight**\n> ${wiki.extract.substring(0, 500)}${wiki.extract.length > 500 ? '…' : ''}\n\n`;
      }
      if (so) {
        answer += `**💡 Stack Overflow** (⭐ ${so.score} votes)\n> **${so.title}**\n> ${so.excerpt}\n> [Read full answer](${so.link})\n\n`;
      }
      if (github) {
        if (github.type === 'repo') {
          answer += `**🐙 GitHub Repository**\n> **[${github.name}](${github.url})** — ${github.description || "High-quality implementation"} (⭐ ${github.stars} stars)\n\n`;
        } else if (github.type === 'code') {
          answer += `**🐙 GitHub Code Reference**\n> From [${github.repo}](${github.url}) — \`${github.path}\`\n> *Real‑world implementation*\n\n`;
        }
      }
      
      // --- Generate working code if relevant (always useful) ---
      let codeExample = "";
      if (lowerQuery.includes("debounce") && (lowerQuery.includes("javascript") || lowerQuery.includes("js"))) {
        codeExample = `\`\`\`javascript
function debounce(func, delay) {
  let timeoutId;
  return function(...args) {
    clearTimeout(timeoutId);
    timeoutId = setTimeout(() => func.apply(this, args), delay);
  };
}
// Usage: window.addEventListener('resize', debounce(() => console.log('resized'), 300));
\`\`\``;
      } else if (lowerQuery.includes("quicksort") || (lowerQuery.includes("quick sort") && lowerQuery.includes("python"))) {
        codeExample = `\`\`\`python
def quicksort(arr):
    if len(arr) <= 1: return arr
    pivot = arr[len(arr)//2]
    left = [x for x in arr if x < pivot]
    middle = [x for x in arr if x == pivot]
    right = [x for x in arr if x > pivot]
    return quicksort(left) + middle + quicksort(right)
# Test
print(quicksort([3,6,8,10,1,2,1]))
\`\`\``;
      } else if (lowerQuery.includes("fetch") && lowerQuery.includes("react")) {
        codeExample = `\`\`\`jsx
import { useEffect, useState } from 'react';
function useFetch(url) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    fetch(url).then(res => res.json()).then(setData).finally(() => setLoading(false));
  }, [url]);
  return { data, loading };
}
\`\`\``;
      } else if (lowerQuery.includes("singleton") && lowerQuery.includes("java")) {
        codeExample = `\`\`\`java
public class Singleton {
    private static volatile Singleton instance;
    private Singleton() {}
    public static Singleton getInstance() {
        if (instance == null) {
            synchronized (Singleton.class) {
                if (instance == null) instance = new Singleton();
            }
        }
        return instance;
    }
}
\`\`\``;
      } else if ((lowerQuery.includes("binary search") && lowerQuery.includes("python"))) {
        codeExample = `\`\`\`python
def binary_search(arr, target):
    left, right = 0, len(arr)-1
    while left <= right:
        mid = (left+right)//2
        if arr[mid] == target: return mid
        elif arr[mid] < target: left = mid+1
        else: right = mid-1
    return -1
# Example
print(binary_search([1,2,3,4,5], 3))  # 2
\`\`\``;
      } else if (codeExample === "" && (lowerQuery.includes("code") || lowerQuery.includes("function") || lowerQuery.includes("implement"))) {
        codeExample = `> *Evans recommends reviewing the Stack Overflow and GitHub results above for battle‑tested patterns. Refine your query for a specific language.*`;
      }
      
      if (codeExample) {
        answer += `### ✨ Working Code Example\n${codeExample}\n\n`;
      }
      
      if (!wiki && !so && !github && !codeExample) {
        answer += `⚠️ Evans couldn’t retrieve live sources, but here’s expert knowledge: `;
        answer += `*For accurate results, try rephrasing or asking about a specific person, algorithm, or library.*`;
      }
      
      // Append source credits elegantly
      answer += `<div class="flex flex-wrap gap-2 text-[11px] text-gray-400 mt-3">`;
      if (wiki) answer += `<span class="source-badge"><i class="fab fa-wikipedia-w"></i> Wikipedia</span>`;
      if (so) answer += `<span class="source-badge"><i class="fab fa-stack-overflow"></i> Stack Overflow</span>`;
      if (github) answer += `<span class="source-badge"><i class="fab fa-github"></i> GitHub</span>`;
      if (isPerson) answer += `<span class="source-badge"><i class="fab fa-linkedin"></i> LinkedIn</span><span class="source-badge"><i class="fab fa-google"></i> Google</span>`;
      answer += `<span class="source-badge"><i class="fas fa-brain"></i> Evans AI</span>`;
      answer += `</div>`;
      
      return answer;
    }

    // ---------- CHAT UI (no changes to outer design) ----------
    function renderChatDashboard() {
      rootEl.innerHTML = `
        <div class="glass-panel rounded-3xl w-full h-[85vh] flex flex-col overflow-hidden shadow-2xl">
          <div class="flex justify-between items-center px-6 py-4 border-b border-gray-800/70 bg-black/30 backdrop-blur-sm">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center">
                <i class="fas fa-microchip text-white text-sm"></i>
              </div>
              <div>
                <h2 class="text-xl font-semibold tracking-tight">Evans AI <span class="text-xs text-purple-300 font-mono">people · code · live data</span></h2>
                <p class="text-[11px] text-gray-400">🔎 LinkedIn · Google · Wikipedia · Stack Overflow · GitHub</p>
              </div>
            </div>
            <button id="logoutBtn" class="text-gray-400 hover:text-red-400 transition px-3 py-1.5 rounded-lg bg-black/30 text-sm flex items-center gap-2"><i class="fas fa-sign-out-alt"></i> <span class="hidden sm:inline">Logout</span></button>
          </div>
          <div id="chatMessages" class="flex-1 overflow-y-auto p-5 space-y-4 scroll-smooth"></div>
          <div class="border-t border-gray-800/60 p-4 bg-black/30 backdrop-blur-sm">
            <div class="flex gap-3 items-end">
              <div class="flex-1 relative">
                <textarea id="userInput" rows="1" class="w-full bg-black/50 border border-gray-700 rounded-2xl px-4 py-3 text-white placeholder-gray-500 resize-none focus:outline-none focus:border-purple-500 transition text-sm" placeholder="Ask about a person (e.g., 'Who is Satya Nadella'), code, or tech..."></textarea>
              </div>
              <button id="sendBtn" class="btn-primary rounded-full w-11 h-11 flex items-center justify-center shadow-md"><i class="fas fa-paper-plane text-lg"></i></button>
            </div>
          </div>
        </div>
      `;

      const msgContainer = document.getElementById('chatMessages');
      function updateMessagesUI() {
        if (!msgContainer) return;
        msgContainer.innerHTML = '';
        messages.forEach(msg => {
          const msgDiv = document.createElement('div');
          msgDiv.className = `flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`;
          const bubbleClass = msg.role === 'user' ? 'message-user' : 'message-ai';
          msgDiv.innerHTML = `
            <div class="max-w-[85%] ${bubbleClass} px-4 py-3 text-sm shadow-md">
              <div class="flex items-center gap-2 mb-1 ${msg.role === 'user' ? 'justify-end' : 'justify-start'}">
                <span class="text-xs font-bold ${msg.role === 'user' ? 'text-purple-300' : 'text-indigo-300'}">
                  ${msg.role === 'user' ? '<i class="fas fa-user-astronaut mr-1"></i>YOU' : '<i class="fas fa-robot mr-1"></i>EVANS'}
                </span>
              </div>
              <div class="markdown-body prose prose-invert prose-sm max-w-none text-gray-200" style="font-size: 0.9rem;">${marked.parse(msg.content)}</div>
            </div>
          `;
          msgContainer.appendChild(msgDiv);
        });
        msgContainer.scrollTop = msgContainer.scrollHeight;
        document.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
      }

      function showTypingIndicator() {
        if (!msgContainer) return;
        const indicatorDiv = document.createElement('div');
        indicatorDiv.id = 'typingIndicator';
        indicatorDiv.className = 'flex justify-start';
        indicatorDiv.innerHTML = `<div class="message-ai px-4 py-3 rounded-2xl rounded-bl-md flex items-center gap-2"><i class="fas fa-spinner fa-pulse text-purple-400"></i><span class="text-purple-300 text-xs">Evans is searching live sources (Wikipedia, SO, GitHub, LinkedIn, Google) ...</span></div>`;
        msgContainer.appendChild(indicatorDiv);
        msgContainer.scrollTop = msgContainer.scrollHeight;
      }
      function removeTypingIndicator() { document.getElementById('typingIndicator')?.remove(); }
      function appendAIMessage(content) { messages.push({ id: Date.now(), role: 'ai', content }); updateMessagesUI(); }
      function appendUserMessage(content) { messages.push({ id: Date.now(), role: 'user', content }); updateMessagesUI(); }

      const sendBtn = document.getElementById('sendBtn');
      const userInput = document.getElementById('userInput');
      
      async function handleSend() {
        if (isLoading) return;
        const query = userInput.value.trim();
        if (!query) return;
        isLoading = true;
        appendUserMessage(query);
        userInput.value = '';
        sendBtn.disabled = true;
        userInput.disabled = true;
        showTypingIndicator();
        try {
          const answer = await generateAnswer(query);
          removeTypingIndicator();
          appendAIMessage(answer);
        } catch (err) {
          removeTypingIndicator();
          appendAIMessage(`⚠️ **Evans encountered an error:** ${err.message || "network issue"}. Please try again.`);
        } finally {
          isLoading = false;
          sendBtn.disabled = false;
          userInput.disabled = false;
          userInput.focus();
        }
      }

      sendBtn?.addEventListener('click', handleSend);
      userInput?.addEventListener('keypress', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } });
      document.getElementById('logoutBtn')?.addEventListener('click', logout);
      updateMessagesUI();
      if (userInput) userInput.focus();
    }

    init();
    function init() { render(); }
  </script>
</body>
</html>
