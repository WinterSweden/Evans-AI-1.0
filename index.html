<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Evans AI | Reasoning & Code Expert</title>
  <!-- Google Fonts + Tailwind + Font Awesome + Marked + Highlight.js -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    body {
      background: radial-gradient(circle at 20% 30%, #0a0a0c, #000000);
      font-family: 'Inter', sans-serif;
    }
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #0f0f12;
    }
    ::-webkit-scrollbar-thumb {
      background: #2a2a2e;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }
    .glass-panel {
      background: rgba(10, 10, 15, 0.65);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(50, 50, 70, 0.5);
      box-shadow: 0 20px 35px -12px rgba(0,0,0,0.6);
    }
    .message-user {
      background: linear-gradient(135deg, #1e1a2f, #15121f);
      border: 1px solid #2c2a3a;
      border-radius: 1.5rem;

    }

      background: rgba(20, 20, 30, 0.7);
      border: 1px solid #2e2c3c;
      border-radius: 1.5rem;
      border-bottom-left-radius: 0.25rem;
    }
    .token-input {
      background: rgba(0,0,0,0.6);
      border: 1px solid #3b3b4f;
      transition: all 0.2s;
    }
    .token-input:focus {
      border-color: #a78bfa;
      background: #0a0a0f;
    }
    .btn-primary {
      background: linear-gradient(95deg, #6c47ff, #a855f7);
      transition: 0.2s ease;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px -5px rgba(139, 92, 246, 0.4);
    }
    pre code.hljs {
      background: #0b0b10 !important;
      border-radius: 16px;
      padding: 1rem;
      font-size: 0.85rem;
    }
    .typing-indicator span {
      animation: pulse 1.2s infinite;
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #a78bfa;
      margin: 0 2px;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 60%, 100% { opacity: 0.3; transform: scale(0.9);}
      30% { opacity: 1; transform: scale(1.2);}
    }
    .reasoning-block {
      background: rgba(0, 0, 0, 0.4);
      border-left: 3px solid #a855f7;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      color: #cbd5e1;
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { 'sans': ['Inter', 'system-ui'] }
        }
      }
    }
  </script>
</head>
<body class="text-gray-200 antialiased flex items-center justify-center min-h-screen p-4">

  <div id="app-root" class="w-full max-w-5xl mx-auto"></div>

  <script>
    // ---------- STATE ----------
    let currentToken = localStorage.getItem('evans_auth_token') || null;
    let messages = [];
    let isLoading = false;
    let rootEl = document.getElementById('app-root');

    function render() {
      if (!rootEl) return;
      if (!currentToken) {
        renderLoginScreen();
      } else {
        renderChatDashboard();
      }
    }

    function renderLoginScreen() {
      rootEl.innerHTML = `
        <div class="glass-panel rounded-3xl w-full max-w-md mx-auto p-8 shadow-2xl transition-all duration-300">
          <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 shadow-lg mb-4">
              <i class="fas fa-brain text-3xl text-white"></i>
            </div>
            <h1 class="text-4xl font-bold tracking-tight bg-gradient-to-r from-purple-300 to-indigo-300 bg-clip-text text-transparent">EVANS AI</h1>
            <p class="text-gray-400 mt-2 text-sm">reasoning · code synthesis · expert knowledge</p>
          </div>
          <div class="space-y-5">
            <div>
              <label class="block text-sm font-medium text-gray-300 mb-1 tracking-wide"><i class="fas fa-key mr-1 text-purple-400"></i> Auth token</label>
              <input type="password" id="tokenInput" placeholder="Enter your secure token" class="token-input w-full px-4 py-3 rounded-xl text-white placeholder:text-gray-500 focus:outline-none transition">
              <p class="text-xs text-gray-500 mt-2">🔐 Token-based only — any non-empty token grants access</p>
            </div>
            <button id="loginBtn" class="btn-primary w-full py-3 rounded-xl font-semibold text-white shadow-md flex items-center justify-center gap-2">
              <i class="fas fa-lock-open"></i> Authenticate & Enter
            </button>
          </div>
          <div class="mt-6 text-center text-gray-500 text-xs border-t border-gray-800 pt-5">
            <i class="fas fa-microchip"></i> Evans AI · reasoning-first architecture
          </div>
        </div>
      `;
      const loginBtn = document.getElementById('loginBtn');
      const tokenInput = document.getElementById('tokenInput');
      if (loginBtn) {
        loginBtn.addEventListener('click', () => {
          const token = tokenInput.value.trim();
          if (token === "") {
            alert("Token required — provide any non-empty token to access Evans AI.");
            return;
          }
          currentToken = token;
          localStorage.setItem('evans_auth_token', token);
          messages = [];
          addInitialWelcomeMessage();
          render();
        });
      }
      if (tokenInput) {
        tokenInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') loginBtn?.click();
        });
      }
    }

    function addInitialWelcomeMessage() {
      messages = [{
        id: Date.now(),
        role: 'ai',
        content: `✨ **Evans AI** — reasoning engine & code master.

I analyze your questions step by step, retrieve best practices from my knowledge (inspired by top Stack Overflow discussions and open-source patterns), and deliver **working, production-ready code** along with clear explanations.

*Try:* "Write a React hook to fetch data with error handling" or "Explain quicksort in Python with optimizations".`
      }];
    }

    function logout() {
      localStorage.removeItem('evans_auth_token');
      currentToken = null;
      messages = [];
      isLoading = false;
      render();
    }

    // --------------------------------------------------------------
    // REASONING + WORKING CODE GENERATOR (no scraping mentions)
    // --------------------------------------------------------------
    async function generateEvansResponse(userQuery) {
      // Step 1: Reason about the query
      const reasoning = await reasonAboutQuery(userQuery);
      // Step 2: Produce final answer with working code / solutions
      const finalAnswer = craftFinalAnswer(userQuery, reasoning);
      return { reasoning, finalAnswer };
    }

    // Simulate chain-of-thought reasoning (deterministic but insightful)
    async function reasonAboutQuery(query) {
      const lower = query.toLowerCase();
      let reasoningSteps = [];

      // Detect intent
      if (lower.includes("code") || lower.includes("function") || lower.includes("write") || 
          lower.includes("implement") || lower.includes("script") || lower.includes("program") ||
          lower.includes("algorithm") || lower.includes("sort") || lower.includes("react") ||
          lower.includes("javascript") || lower.includes("python") || lower.includes("java") ||
          lower.includes("api") || lower.includes("fetch") || lower.includes("hook") ||
          lower.includes("component") || lower.includes("class")) {
        reasoningSteps.push("📌 Query classified as **coding / implementation request**.");
        reasoningSteps.push("🧠 Evans recalls proven solutions from Stack Overflow, GitHub, and official docs — prioritizing correctness, edge cases, and modern best practices.");
      } else {
        reasoningSteps.push("📌 Query classified as **knowledge / explanation request**.");
        reasoningSteps.push("🧠 Evans synthesizes information from authoritative sources (MDN, Wikipedia, IEEE, O'Reilly) and reasoning to produce a clear, accurate answer.");
      }

      // language detection
      let lang = "general";
      if (lower.includes("python")) lang = "Python";
      else if (lower.includes("javascript") || lower.includes("js")) lang = "JavaScript";
      else if (lower.includes("java")) lang = "Java";
      else if (lower.includes("c++")) lang = "C++";
      else if (lower.includes("react")) lang = "React";
      else if (lower.includes("go") || lower.includes("golang")) lang = "Go";
      else if (lower.includes("rust")) lang = "Rust";
      
      if (lang !== "general") {
        reasoningSteps.push(`🔍 Detected primary language: **${lang}** — will generate idiomatic, runnable ${lang} code with error handling and comments.`);
      }

      reasoningSteps.push("⚙️ Evans applies zero‑hallucination verification: each code block is tested against common edge cases and follows official specs.");
      reasoningSteps.push("💡 Final answer includes **reasoning summary** and **actionable solution** with references to real‑world engineering patterns.");

      return reasoningSteps;
    }

    function craftFinalAnswer(query, reasoningSteps) {
      const lower = query.toLowerCase();
      
      // Helper: generate working code snippets based on detected need
      let codeBlock = "";
      let explanation = "";

      // ---------- WORKING CODE GENERATION (real, runnable examples) ----------
      if (lower.includes("react") && (lower.includes("fetch") || lower.includes("api") || lower.includes("hook"))) {
        codeBlock = `\`\`\`jsx
import { useState, useEffect } from 'react';

function useFetch(url) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  useEffect(() => {
    const abortController = new AbortController();
    const fetchData = async () => {
      try {
        const response = await fetch(url, { signal: abortController.signal });
        if (!response.ok) throw new Error(\`HTTP \${response.status}\`);
        const json = await response.json();
        setData(json);
      } catch (err) {
        if (err.name !== 'AbortError') setError(err.message);
      } finally {
        setLoading(false);
      }
    };
    fetchData();
    return () => abortController.abort();
  }, [url]);

  return { data, loading, error };
}

// Usage example:
function App() {
  const { data, loading, error } = useFetch('https://jsonplaceholder.typicode.com/posts/1');
  if (loading) return <div>Loading...</div>;
  if (error) return <div>Error: {error}</div>;
  return <pre>{JSON.stringify(data, null, 2)}</pre>;
}
\`\`\`
✅ *This custom React hook handles loading states, aborting requests, and errors — referenced from patterns on Stack Overflow and React docs.*`;
        explanation = "The hook uses `AbortController` to prevent memory leaks, supports dynamic URLs, and provides a clean interface.";
      } 
      else if (lower.includes("quicksort") || (lower.includes("quick sort") && lower.includes("python"))) {
        codeBlock = `\`\`\`python
def quicksort(arr):
    if len(arr) <= 1:
        return arr
    pivot = arr[len(arr) // 2]
    left = [x for x in arr if x < pivot]
    middle = [x for x in arr if x == pivot]
    right = [x for x in arr if x > pivot]
    return quicksort(left) + middle + quicksort(right)

# Example & test
if __name__ == "__main__":
    test_array = [3, 6, 8, 10, 1, 2, 1, 5]
    sorted_arr = quicksort(test_array)
    print("Original:", test_array)
    print("Sorted:  ", sorted_arr)
    # Edge case: empty or single element
    assert quicksort([]) == []
    assert quicksort([42]) == [42]
\`\`\`
📌 *Time complexity: O(n log n) average, O(n²) worst-case (pivot selection matters). This implementation is stable and in-place using list comprehensions (practical). Inspired by GitHub gists and classic CLRS.*`;
        explanation = "Quicksort divides and conquers: picks a pivot, partitions elements, then recursively sorts each side.";
      }
      else if (lower.includes("async") && lower.includes("python") && (lower.includes("fetch") || lower.includes("http"))) {
        codeBlock = `\`\`\`python
import aiohttp
import asyncio

async def fetch_json(url):
    async with aiohttp.ClientSession() as session:
        async with session.get(url) as response:
            response.raise_for_status()
            return await response.json()

async def main():
    urls = [
        "https://api.github.com/repos/python/cpython",
        "https://api.github.com/repos/microsoft/vscode"
    ]
    tasks = [fetch_json(url) for url in urls]
    results = await asyncio.gather(*tasks)
    for data in results:
        print(f"Repo: {data['full_name']} - ⭐ {data['stargazers_count']}")

if __name__ == "__main__":
    asyncio.run(main())
\`\`\`
✅ *Uses aiohttp for high‑performance async HTTP requests. Error handling included. Ideal for concurrent API calls (Stack Overflow recommended).*`;
        explanation = "Asynchronous I/O allows efficient network requests without blocking. `asyncio.gather` runs tasks concurrently.";
      }
      else if ((lower.includes("sort") || lower.includes("algorithm")) && lower.includes("javascript")) {
        codeBlock = `\`\`\`javascript
// Merge Sort - stable, O(n log n)
function mergeSort(arr) {
  if (arr.length <= 1) return arr;
  const mid = Math.floor(arr.length / 2);
  const left = mergeSort(arr.slice(0, mid));
  const right = mergeSort(arr.slice(mid));
  return merge(left, right);
}

function merge(left, right) {
  let result = [], i = 0, j = 0;
  while (i < left.length && j < right.length) {
    if (left[i] <= right[j]) result.push(left[i++]);
    else result.push(right[j++]);
  }
  return result.concat(left.slice(i)).concat(right.slice(j));
}

// Example:
const unsorted = [38, 27, 43, 3, 9, 82, 10];
console.log(mergeSort(unsorted)); // [3, 9, 10, 27, 38, 43, 82]
\`\`\`
📘 *Merge sort is divide & conquer — reliable for large datasets. From popular JS implementations on GitHub.*`;
        explanation = "Merge sort recursively splits array into halves, then merges sorted halves. Guaranteed O(n log n) performance.";
      }
      else if (lower.includes("singleton") || (lower.includes("design pattern") && lower.includes("java"))) {
        codeBlock = `\`\`\`java
public class Singleton {
    private static volatile Singleton instance;
    private Singleton() {}

    public static Singleton getInstance() {
        if (instance == null) {
            synchronized (Singleton.class) {
                if (instance == null) {
                    instance = new Singleton();
                }
            }
        }
        return instance;
    }
    
    public void showMessage() {
        System.out.println("Hello from Evans AI Singleton!");
    }
}

// Usage: Singleton.getInstance().showMessage();
\`\`\`
🔒 *Thread‑safe lazy initialization using double‑checked locking (effective Java pattern).*`;
        explanation = "Singleton ensures only one instance exists. volatile + synchronized guarantees correctness in multithreaded environments.";
      }
      else if (lower.includes("binary search") && lower.includes("python")) {
        codeBlock = `\`\`\`python
def binary_search(arr, target):
    left, right = 0, len(arr) - 1
    while left <= right:
        mid = (left + right) // 2
        if arr[mid] == target:
            return mid
        elif arr[mid] < target:
            left = mid + 1
        else:
            right = mid - 1
    return -1

# Example (sorted list required)
sorted_nums = [2, 5, 8, 12, 16, 23, 38, 56, 72, 91]
print(binary_search(sorted_nums, 23))  # Output: 5
print(binary_search(sorted_nums, 99))  # Output: -1
\`\`\`
⚡ *O(log n) time complexity. Edge cases: empty list, target at ends, duplicate values (returns first occurrence due to condition).*`;
        explanation = "Binary search halves the search space each iteration. Requires sorted input.";
      }
      else {
        // Generic but high-quality coding answer or general knowledge
        if (lower.includes("code") || lower.includes("implement") || lower.includes("function")) {
          codeBlock = `\`\`\`python
# General purpose solution template based on your request:
def solve_problem(*args, **kwargs):
    """
    Insert custom logic here based on specifications.
    Evans AI advises breaking down the problem:
    1. Understand inputs/outputs
    2. Choose appropriate data structures
    3. Implement algorithm with tests
    """
    # Example: compute factorial iteratively (robust)
    def factorial(n):
        if not isinstance(n, int) or n < 0:
            raise ValueError("Non-negative integer required")
        result = 1
        for i in range(2, n + 1):
            result *= i
        return result
    return factorial

# Usage: factorial(5) -> 120
\`\`\`
🔧 *This pattern is flexible; adapt to your language and constraints. Need a specific solution? Clarify the language and edge cases.*`;
          explanation = "Evans provides a generic but solid foundation — adjust as needed for your exact use case.";
        } else {
          codeBlock = "";
          explanation = "Evans delivers a thorough, reasoning‑based explanation using trusted sources (Stack Overflow, GitHub, official docs).";
        }
      }

      // Build reasoning display (front-end will render it nicely)
      const reasoningBullets = reasoningSteps.map(step => `• ${step}`).join('\n');
      
      let finalMarkdown = "";
      if (codeBlock) {
        finalMarkdown = `### 🧠 Evans AI — Reasoning Trace\n\n<div class="reasoning-block">\n${reasoningBullets}\n</div>\n\n### ✨ Final Solution\n\n${codeBlock}\n\n**Explanation:** ${explanation}\n\n> 📚 *References: real-world patterns from Stack Overflow (upvoted solutions), GitHub trending repos, and official language specifications.*`;
      } else {
        finalMarkdown = `### 🧠 Evans AI — Reasoning Trace\n\n<div class="reasoning-block">\n${reasoningBullets}\n</div>\n\n### 📖 Answer\n\n${explanation}\n\n> 🔍 Evans synthesized this answer from high‑quality engineering resources and logical deduction.`;
      }
      
      return finalMarkdown;
    }

    // --------------------------------------------------------------
    // CHAT UI RENDERER (similar to before but with new response flow)
    // --------------------------------------------------------------
    function renderChatDashboard() {
      rootEl.innerHTML = `
        <div class="glass-panel rounded-3xl w-full h-[85vh] flex flex-col overflow-hidden shadow-2xl">
          <div class="flex justify-between items-center px-6 py-4 border-b border-gray-800/70 bg-black/30 backdrop-blur-sm">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center">
                <i class="fas fa-microchip text-white text-sm"></i>
              </div>
              <div>
                <h2 class="text-xl font-semibold tracking-tight">Evans AI <span class="text-xs text-purple-300 font-mono">reasoning · code expert</span></h2>
                <p class="text-[11px] text-gray-400">⚡ working code · stack overflow patterns · github wisdom</p>
              </div>
            </div>
            <button id="logoutBtn" class="text-gray-400 hover:text-red-400 transition px-3 py-1.5 rounded-lg bg-black/30 text-sm flex items-center gap-2"><i class="fas fa-sign-out-alt"></i> <span class="hidden sm:inline">Logout</span></button>
          </div>
          <div id="chatMessages" class="flex-1 overflow-y-auto p-5 space-y-4 scroll-smooth"></div>
          <div class="border-t border-gray-800/60 p-4 bg-black/30 backdrop-blur-sm">
            <div class="flex gap-3 items-end">
              <div class="flex-1 relative">
                <textarea id="userInput" rows="1" class="w-full bg-black/50 border border-gray-700 rounded-2xl px-4 py-3 text-white placeholder-gray-500 resize-none focus:outline-none focus:border-purple-500 transition text-sm" placeholder="Ask Evans anything — algorithms, frameworks, code solutions..."></textarea>
              </div>
              <button id="sendBtn" class="btn-primary rounded-full w-11 h-11 flex items-center justify-center shadow-md"><i class="fas fa-paper-plane text-lg"></i></button>
            </div>
            <div class="text-[10px] text-gray-500 mt-2 flex justify-between">
              <span><i class="fas fa-brain mr-1"></i> step‑by‑step reasoning</span>
              <span><i class="fas fa-check-circle"></i> production‑grade code</span>
            </div>
          </div>
        </div>
      `;

      const msgContainer = document.getElementById('chatMessages');
      function updateMessagesUI() {
        if (!msgContainer) return;
        msgContainer.innerHTML = '';
        messages.forEach(msg => {
          const msgDiv = document.createElement('div');
          msgDiv.className = `flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'} animate-fadeIn`;
          const bubbleClass = msg.role === 'user' ? 'message-user' : 'message-ai';
          msgDiv.innerHTML = `
            <div class="max-w-[85%] ${bubbleClass} px-4 py-3 text-sm shadow-md">
              <div class="flex items-center gap-2 mb-1 ${msg.role === 'user' ? 'justify-end' : 'justify-start'}">
                <span class="text-xs font-bold ${msg.role === 'user' ? 'text-purple-300' : 'text-indigo-300'}">
                  ${msg.role === 'user' ? '<i class="fas fa-user-astronaut mr-1"></i>YOU' : '<i class="fas fa-robot mr-1"></i>EVANS'}
                </span>
              </div>
              <div class="markdown-body prose prose-invert prose-sm max-w-none text-gray-200" style="font-size: 0.9rem;">${marked.parse(msg.content)}</div>
            </div>
          `;
          msgContainer.appendChild(msgDiv);
        });
        msgContainer.scrollTop = msgContainer.scrollHeight;
        document.querySelectorAll('pre code').forEach((block) => {
          hljs.highlightElement(block);
        });
      }

      function showTypingIndicator() {
        if (!msgContainer) return;
        const indicatorDiv = document.createElement('div');
        indicatorDiv.id = 'typingIndicator';
        indicatorDiv.className = 'flex justify-start';
        indicatorDiv.innerHTML = `
          <div class="message-ai px-4 py-3 rounded-2xl rounded-bl-md flex items-center gap-1">
            <span class="text-purple-300 text-xs mr-1">Evans is reasoning & formulating solution</span>
            <div class="typing-indicator flex gap-1"><span></span><span></span><span></span></div>
          </div>
        `;
        msgContainer.appendChild(indicatorDiv);
        msgContainer.scrollTop = msgContainer.scrollHeight;
      }
      function removeTypingIndicator() {
        const indicator = document.getElementById('typingIndicator');
        if (indicator) indicator.remove();
      }
      function appendAIMessage(content) {
        messages.push({ id: Date.now(), role: 'ai', content: content });
        updateMessagesUI();
      }
      function appendUserMessage(content) {
        messages.push({ id: Date.now(), role: 'user', content: content });
        updateMessagesUI();
      }

      const sendBtn = document.getElementById('sendBtn');
      const userInputEl = document.getElementById('userInput');

      async function handleSendMessage() {
        if (isLoading) return;
        const rawMsg = userInputEl.value.trim();
        if (!rawMsg) return;
        isLoading = true;
        appendUserMessage(rawMsg);
        userInputEl.value = '';
        if (sendBtn) sendBtn.disabled = true;
        userInputEl.disabled = true;
        showTypingIndicator();
        
        try {
          const { reasoning, finalAnswer } = await generateEvansResponse(rawMsg);
          removeTypingIndicator();
          appendAIMessage(finalAnswer);
        } catch (err) {
          removeTypingIndicator();
          appendAIMessage(`⚠️ *Reasoning engine error:* ${err.message || "unexpected"} — but Evans always delivers. Please retry.`);
        } finally {
          isLoading = false;
          if (sendBtn) sendBtn.disabled = false;
          if (userInputEl) userInputEl.disabled = false;
          userInputEl.focus();
        }
      }
      
      sendBtn?.addEventListener('click', handleSendMessage);
      userInputEl?.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSendMessage();
        }
      });
      document.getElementById('logoutBtn')?.addEventListener('click', logout);
      updateMessagesUI();
      if (userInputEl) userInputEl.focus();
    }
    
    init();
    function init() { render(); }
  </script>
</body>
</html>
