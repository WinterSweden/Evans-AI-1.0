<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Query Interface</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }
        .container {
            width: 80%;
            margin: 0 auto;
            padding: 20px;
            border-radius: 8px;
            background: #282828;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }
        h1 {
            text-align: center;
            color: #4caf50;
        }
        textarea {
            width: 100%;
            height: 100px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #333;
            color: #f5f5f5;
            padding: 10px;
            resize: none;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #4caf50;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Query Interface</h1>
        <textarea placeholder="Type your query here..."></textarea>
        <button>Submit</button>
    </div>
</body>
</html>
